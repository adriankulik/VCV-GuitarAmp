name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Fetch all tags and git notes
        run: |
          git config --add remote.origin.fetch "+refs/notes/*:refs/notes/*"
          git fetch origin "+refs/notes/*:refs/notes/*" || true
          git fetch origin "+refs/tags/*:refs/tags/*" || true

      - name: Setup Git identity
        run: |
          git config --global user.name "semantic-release-bot"
          git config --global user.email "semantic-release-bot@martynus.net"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install --no-save semantic-release@^24 @semantic-release/exec@^6 @semantic-release/git@^10 @semantic-release/github@^11 @semantic-release/commit-analyzer@^13 @semantic-release/release-notes-generator@^14

      - name: Setup VCV Rack SDK
        run: |
          pushd $HOME
          for i in 1 2 3; do
            wget -c --tries=3 -O Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-latest-lin-x64.zip && break || sleep 2
          done
          unzip -q -o Rack-SDK.zip
          popd
          echo "RACK_DIR=$HOME/Rack-SDK" >> $GITHUB_ENV

      - name: Semantic Release
        id: semantic_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release --extends ./.github/.releaserc.json

      - name: Ensure GitHub Release Exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION=$(jq -r .version plugin.json)
          TAG="v$VERSION"
          echo "Checking release status for $TAG..."

          TAG_EXISTS=false
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            TAG_EXISTS=true
          fi

          if [ "$TAG_EXISTS" = true ]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "⚠️ Tag $TAG exists in repository but GitHub Release is missing! Running self-healing release..."
              make clean
              make dep
              make dist
              gh release create "$TAG" dist/*.vcvplugin \
                --title "$TAG" \
                --generate-notes
              echo "✅ Successfully self-healed and created release $TAG."
            else
              echo "✅ GitHub Release $TAG is present and verified."
            fi
          else
            if [ "${{ steps.semantic_release.outcome }}" = "failure" ]; then
              echo "❌ Semantic release failed and no tag was created."
              exit 1
            else
              echo "ℹ️ No new release needed for this push."
            fi
          fi
